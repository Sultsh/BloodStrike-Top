<!doctype html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blood Strike Donat</title>

<style>
:root{
 --bg:#0b1020; --card:#121a33; --text:#e9ecff; --muted:#a9b0d6;
 --line:rgba(255,255,255,.08); --accent:#ff4bd6; --accent2:#31d6ff;
 --ok:#2de38c; --danger:#ff6b6b; --radius:18px;
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui;background:var(--bg);color:var(--text)}
.container{width:min(1100px,92vw);margin:24px auto}

header{display:flex;justify-content:space-between;align-items:center}
.brand{display:flex;gap:12px;align-items:center}
.logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:contain}

.btn{border:1px solid var(--line);background:#1a2344;color:#fff;padding:10px 12px;border-radius:14px;cursor:pointer}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border:0;color:#071025;font-weight:800}

.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:16px;margin-top:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px}

.list{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item{border:1px solid var(--line);border-radius:14px;padding:10px;cursor:pointer;display:flex;gap:10px;align-items:center}
.item.active{outline:2px solid var(--accent2)}
.pack-ico{width:36px;height:36px;border-radius:10px;background:#0f1630;padding:5px}

.input{width:100%;padding:12px;border-radius:14px;border:1px solid var(--line);background:#0f1630;color:#fff}
.input.err{border-color:var(--danger);box-shadow:0 0 0 3px rgba(255,0,0,.2)}

.cardPay{
 border-radius:16px;padding:16px;
 background:linear-gradient(135deg,#1f2a55,#0f1630);
 border:1px solid var(--line);
}
.cardNum{font-size:18px;letter-spacing:2px;margin:10px 0;font-weight:900}

.payTabs{display:flex;gap:8px;margin-top:12px}
.payTab{flex:1;border:1px solid var(--line);padding:8px;border-radius:12px;text-align:center;cursor:pointer}
.payTab.active{outline:2px solid var(--accent2)}

.small{font-size:12px;color:var(--muted)}
</style>
</head>

<body>
<div class="container">

<header>
<div class="brand">
<div class="logo"><img src="assets/img/bloodstrike.png"></div>
<div><b>Blood Strike</b><div class="small">Donat</div></div>
</div>
<div style="display:flex;gap:8px">
<button class="btn" id="adminBtn">🔐 Admin</button>
</div>
</header>

<div class="grid">

<!-- LEFT -->
<div class="card">
<b>Paketlar</b>
<div class="list" id="list"></div>
</div>

<!-- RIGHT -->
<div class="card">
<b>Buyurtma</b>

<div style="margin-top:10px" class="small">O'yin ID</div>
<input id="pid" class="input">

<div id="summary" style="margin-top:12px"></div>

<!-- 💳 PAY BLOCK -->
<div style="margin-top:16px">
<b>To'lov usuli</b>

<div class="payTabs">
<div class="payTab active" data-pay="me">Mening karta</div>
<div class="payTab" data-pay="friend">Sherik karta</div>
</div>

<div id="cardBox" class="cardPay" style="margin-top:10px"></div>
</div>

<div style="display:flex;gap:10px;margin-top:14px">
<button id="copyCard" class="btn">📋 Copy karta</button>
<button id="buy" class="btn primary">Sotib olish</button>
</div>

</div>
</div>
</div>

<script type="module">

/* ========= FIREBASE ========= */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
 apiKey:"AIzaSyBKhvdPBHC0Ml7d4-lJs_31jkrvPxpX6BM",
 authDomain:"bloodstrike-aec49.firebaseapp.com",
 projectId:"bloodstrike-aec49",
 appId:"1:972640427859:web:af1c051b6f4da4825acba6"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* ========= ADMIN ROUTING ========= */

const ADMIN_MAP = {
 admin1:"SULTSH_YT",
 admin2:"dilshodbs1031"
};

let cachedAdmin="admin1";

onSnapshot(doc(db,"settings","main"), snap=>{
 if(snap.exists()){
   cachedAdmin = snap.data().activeAdmin || "admin1";
 }
});

/* ========= CARDS ========= */

const CARDS = {
 me:{
  humo:"5614687304943229",
  phone:"+998995467410"
 },
 friend:{
  uzcard:"5614681816455285",
  humo:"9860100124515832",
  phone:"+998906282228"
 }
};

let payMode="me";

/* ========= PACKS ========= */

const PACKS=[
{id:"g100",title:"100 + 5 Gold",price:"9.999"},
{id:"g500",title:"500 + 40 Gold",price:"44.999"},
{id:"g1000",title:"1000 + 100 Gold",price:"89.999"}
];

let active=null;

const list=document.getElementById("list");
PACKS.forEach(p=>{
 const d=document.createElement("div");
 d.className="item";
 d.innerHTML=`<img class="pack-ico" src="assets/img/gold-100.png"><div>${p.title}<br><b>${p.price}</b></div>`;
 d.onclick=()=>{active=p;document.querySelectorAll(".item").forEach(x=>x.classList.remove("active"));d.classList.add("active");updateSummary();}
 list.appendChild(d);
});

/* ========= PAY UI ========= */

document.querySelectorAll(".payTab").forEach(t=>{
 t.onclick=()=>{
  document.querySelectorAll(".payTab").forEach(x=>x.classList.remove("active"));
  t.classList.add("active");
  payMode=t.dataset.pay;
  renderCard();
 };
});

function renderCard(){
 const box=document.getElementById("cardBox");
 if(payMode==="me"){
   box.innerHTML=`<div>HUMO</div><div class="cardNum">${CARDS.me.humo}</div><div class="small">${CARDS.me.phone}</div>`;
 }else{
   box.innerHTML=`<div>UZCARD</div><div class="cardNum">${CARDS.friend.uzcard}</div>
                  <div>HUMO</div><div class="cardNum">${CARDS.friend.humo}</div>
                  <div class="small">${CARDS.friend.phone}</div>`;
 }
}
renderCard();

/* ========= SUMMARY ========= */

function updateSummary(){
 if(!active) return;
 document.getElementById("summary").innerHTML=
 `<b>${active.title}</b><br>${active.price} uzs`;
}

/* ========= BUY ========= */

document.getElementById("buy").onclick=()=>{
 if(!active) return alert("Paket tanla");
 const pid=document.getElementById("pid");
 if(pid.value.length<5){
   pid.classList.add("err");
   setTimeout(()=>pid.classList.remove("err"),900);
   return;
 }

 const tg=ADMIN_MAP[cachedAdmin];

 const cardText = payMode==="me"
   ? CARDS.me.humo
   : CARDS.friend.uzcard;

 const msg=`Salom men ${active.title} olmoqchiman
Narx: ${active.price}
ID: ${pid.value}
Karta: ${cardText}`;

 window.open(`https://t.me/${tg}?text=`+encodeURIComponent(msg));
};

/* ========= COPY CARD ========= */

document.getElementById("copyCard").onclick=()=>{
 const text = payMode==="me" ? CARDS.me.humo : CARDS.friend.uzcard;
 navigator.clipboard.writeText(text);
 alert("Karta nusxalandi");
};

</script>
</body>
</html>
